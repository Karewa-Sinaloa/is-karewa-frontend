name: karewa-frontend

services:
    frontend:
        build:
            context: .
            dockerfile: docker/frontend/Dockerfile
        image: karewa-frontend:dev
        container_name: karewa_frontend
        working_dir: /app
        env_file:
            - .env
        volumes:
            - .:/app
            - frontend_node_modules:/app/node_modules
        expose:
            - '5174'
        networks:
            - app_net
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5174/ >/dev/null || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    proxy:
        build:
            context: .
            dockerfile: docker/proxy/Dockerfile
        container_name: karewa_proxy
        depends_on:
            frontend:
                condition: service_healthy
        expose:
            - '80'
        networks:
            - app_net
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    cloudflared:
        image: cloudflare/cloudflared:2026.3.0
        container_name: karewa_cloudflared
        profiles:
            - cloudflared
        user: '0:0'
        depends_on:
            proxy:
                condition: service_healthy
        networks:
            - app_net
        restart: unless-stopped
        healthcheck:
            test:
                - CMD
                - cloudflared
                - tunnel
                - info
                - 8513e7b5-f9e3-44e7-a62d-23105820322a
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 15s
        command:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yml
            - run
        volumes:
            - ${CLOUDFLARED_HOST_CREDENTIALS_PATH:-/home/criselgeek/.cloudflared/8513e7b5-f9e3-44e7-a62d-23105820322a.json}:${CLOUDFLARED_CREDENTIALS_FILE:-/etc/cloudflared/8513e7b5-f9e3-44e7-a62d-23105820322a.json}:ro
            - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro

volumes:
    frontend_node_modules:

networks:
    app_net:
        external: true
        name: app_net
